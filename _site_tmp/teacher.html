<script type="module">
    import { javaURI, fetchOptions } from '/portfolio1/assets/js/api/config.js';

    document.addEventListener('DOMContentLoaded', function() {
        getCredentialsJava()
            .then(data => {
                const signupLink = document.getElementById('signupLink');
                const loginLink = document.getElementById('loginLink');
                const logoutLink = document.getElementById('logoutLink');
                const calendarLink = document.getElementById('calendarLink');
                const profileLink = document.getElementById('profileLink');
                const studentToolkitLink = document.getElementById('studentToolkitLink');
                const teacherToolkitLink = document.getElementById('teacherToolkitLink');

                if (data) { // User is authenticated
                    // Hide signup and login links
                    signupLink.style.display = 'none';
                    loginLink.style.display = 'none';

                    // Display Toolkits"
                    calendarLink.innerHTML = `<a href="/portfolio1/portfolio/calendar">Calendar</a>`;
                    profileLink.innerHTML = `<a href="/portfolio1/profile">Profile</a>`;
                    studentToolkitLink.innerHTML = `<a href="/portfolio1/portfolio">Student Toolkit</a>`;
                    // Check for teacher role to display "Teacher Toolkit"
                    const isTeacher = data.roles.some(role => role.name === 'ROLE_TEACHER');
                    if (isTeacher) {
                        teacherToolkitLink.innerHTML = `<a href="/portfolio1/teacher">Teacher Toolkit</a>`;
                    }

                    // Display logout link
                    logoutLink.innerHTML = `<a href="/portfolio1/logoutjava">Logout of Toolkit</a>`;
                } else {
                    // User is not authenticated, show signup and login links
                    signupLink.innerHTML = `<a href="/portfolio1/signup">Signup for Toolkit</a>`;
                    loginLink.innerHTML = `<a href="/portfolio1login">Login to Toolkit</a>`;

                    // Hide other links
                    calendarLink.style.display = 'none';
                    profileLink.style.display = 'none';
                    studentToolkitLink.style.display = 'none';
                    teacherToolkitLink.style.display = 'none';
                    logoutLink.style.display = 'none';
                }
            })
            .catch(err => {
                console.error("Error fetching credentials: ", err);
            });
    });

    function getCredentialsJava() {
        const URL = javaURI + '/api/person/get';
        return fetch(URL, fetchOptions)
            .then(response => {
                if (response.status !== 200) {
                    console.error("HTTP status code: " + response.status);
                    return null;
                }
                return response.json();
            })
            .then(data => {
                if (data === null) return null;
                console.log(data);
                return data;
            })
            .catch(err => {
                console.error("Fetch error: ", err);
                return null;
            });
    }
</script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const style = getComputedStyle(document.documentElement);

        const panel = style.getPropertyValue('--panel-mid').trim() || "#0b1220";
        const text = style.getPropertyValue('--pref-text-color').trim() || "#e6eef8";
        const accent = style.getPropertyValue('--pref-accent-color').trim() || "#3b82f6";
        const fontFamily = style.getPropertyValue('--pref-font-family').trim() || "Arial, sans-serif";
        mermaid.initialize({ 
            startOnLoad: false,
            theme: theme,
            securityLevel: 'loose',
            themeVariables: {
                background: panel,
                primaryColor: panel,
                primaryTextColor: text,
                primaryBorderColor: accent,
                lineColor: text,
                arrowheadColor: text,
                fontFamily: fontFamily
            }
        });
        
        // Convert fenced code blocks to mermaid divs
        document.querySelectorAll('pre code.language-mermaid').forEach((block, index) => {
            const content = block.textContent;
            const wrapper = document.createElement('div');
            wrapper.className = 'mermaid';
            wrapper.id = 'mermaid-' + index;
            wrapper.textContent = content;
            block.parentElement.parentNode.replaceChild(wrapper, block.parentElement);
        });
        
        mermaid.run();
    });
